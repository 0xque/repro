name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --no-engine-strict --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: node config/generate-schemas.mjs --check
  site-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --no-engine-strict --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm --prefix site ci --ignore-scripts
      - run: npm --prefix site run build
      - run: git diff --exit-code -- site/index.html site/worker.mjs
      - run: node --test site/build-worker.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node --test site/reading-rule.test.mjs
        env:
          REPRO_SCREENSHOTS: ${{ runner.temp }}/repro-ruler
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: repro-ruler-preview
          path: ${{ runner.temp }}/repro-ruler/*.png
          if-no-files-found: error
          retention-days: 14
